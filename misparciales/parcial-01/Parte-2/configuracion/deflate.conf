<IfModule mod_deflate.c>
	DeflateCompressionLevel 6	
	# pruebe con 1, 6 y 9
	 AddOutputFilterByType DEFLATE text/html text/plain text/xml \
		text/css text/javascript application/xml application/javascript application/json image/svg+xml

	# Excluir binarios ya comprimidos (imágenes, video, zip)
	SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|webp|mp4|avi|zip|gz|pdf)$ \ no-gzip dont-vary
</IfModule>

