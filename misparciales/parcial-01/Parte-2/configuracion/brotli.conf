<IfModule mod_brotli.c>

    # Calidad de compresión.
    # Durante las pruebas se cambiará entre 5 y 11.
    BrotliCompressionQuality 5

    # Ventana de compresión solicitada por el taller.
    BrotliCompressionWindow 22

    # Tipos de contenido que serán comprimidos.
    AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/css \
    text/xml application/xml application/javascript text/javascript application/json image/svg+xml

    # No comprimir archivos que ya están comprimidos
    # o que son archivos binarios.
    SetEnvIfNoCase Request_URI "\.(?:gif|jpe?g|png|webp|mp4|avi|zip|gz|pdf)$" \
        no-brotli

</IfModule>
